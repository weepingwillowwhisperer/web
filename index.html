<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willow</title>
    <style>
        :root {
            --black: #11100e;
            --beige: #d9c7ad;
            --white: #fffaf0;
            --soft-black: #1d1a16;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px;
        }

        .site {
            width: min(100%, 760px);
            border: 1px solid rgba(217, 199, 173, 0.38);
            background: linear-gradient(145deg, var(--soft-black), var(--black));
            padding: clamp(32px, 8vw, 72px);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--beige);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--white);
            font-size: clamp(64px, 16vw, 150px);
            font-weight: 400;
            line-height: 0.9;
        }

        .willow-mark {
            width: min(100%, 240px);
            height: auto;
            margin: 30px auto 28px;
            color: var(--beige);
            display: block;
        }

        .willow-mark path,
        .willow-mark ellipse {
            vector-effect: non-scaling-stroke;
        }

        p {
            max-width: 520px;
            margin: 0 auto;
            color: var(--beige);
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(16px, 2.4vw, 20px);
            line-height: 1.7;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 38px;
        }

        a {
            border: 1px solid var(--beige);
            color: var(--white);
            padding: 12px 18px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-decoration: none;
            text-transform: uppercase;
        }

        a:hover,
        a:focus-visible {
            background: var(--beige);
            color: var(--black);
        }

        a:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <section class="site" aria-labelledby="site-title">
            <p class="eyebrow">soft tools for clear days</p>
            <h1 id="site-title">Willow</h1>
            <svg class="willow-mark" viewBox="0 0 260 92" role="img" aria-label="Minimal willow branch">
                <path d="M21 64C75 29 139 19 238 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M70 45C65 60 56 69 44 75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M113 33C106 51 93 62 80 68" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M158 27C152 45 139 58 123 65" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M201 27C195 42 184 52 170 58" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <ellipse cx="43" cy="75" rx="8" ry="3" transform="rotate(-28 43 75)" fill="currentColor" opacity="0.9"/>
                <ellipse cx="78" cy="68" rx="9" ry="3" transform="rotate(-24 78 68)" fill="currentColor" opacity="0.9"/>
                <ellipse cx="121" cy="65" rx="9" ry="3" transform="rotate(-20 121 65)" fill="currentColor" opacity="0.9"/>
                <ellipse cx="169" cy="58" rx="8" ry="3" transform="rotate(-22 169 58)" fill="currentColor" opacity="0.9"/>
            </svg>
            <p>A quiet digital space for reset, reflection, and small supportive rituals.</p>
            <nav aria-label="Willow tools">
                <a href="./reset/index.html">Start with Reset</a>
                <a href="./spoons/index.html">Track Spoons</a>
            </nav>
        </section>
    </main>
</body>
</html>
