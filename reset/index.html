<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willow Reset</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --fg: #e0e0e0;
            --muted: #888;
            --accent: #4a9eff;
            --border: #333;
        }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
        }
        h1, h2 {
            color: var(--accent);
            font-weight: 300;
        }
        .section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .grounding-list {
            text-align: left;
            display: inline-block;
            list-style: none;
            padding: 0;
        }
        .grounding-list li {
            margin: 10px 0;
        }
        .grounding-list span {
            color: var(--accent);
            font-weight: bold;
            margin-right: 10px;
        }
        .pacer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .circle {
            width: 100px;
            height: 100px;
            border: 4px solid var(--accent);
            border-radius: 50%;
            margin: 20px;
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.8); opacity: 1; }
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: var(--fg);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: var(--accent);
            background: rgba(74, 158, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willow Reset</h1>
        
        <div class="section">
            <h2>Sensory Grounding</h2>
            <ul class="grounding-list">
                <li><span>5</span> things you can see</li>
                <li><span>4</span> things you can touch</li>
                <li><span>3</span> things you can hear</li>
                <li><span>2</span> things you can smell</li>
                <li><span>1</span> thing you can taste</li>
            </ul>
        </div>

        <div class="section pacer-container">
            <h2>Quick-Clear Pacer</h2>
            <div class="circle"></div>
            <p style="color: var(--muted)">Breathe with the circle</p>
        </div>

        <a href="../" class="btn">Return to Willow</a>
    </div>
</body>
</html>
